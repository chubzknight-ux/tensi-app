<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14"><title>TENSI</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0f14;--cd:#141c26;--ac:#7cf5c8;--wm:#ffb86b;--rd:#ff5d6c;--tx:#e8eef5;--mu:#8a98a8}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding-bottom:40px}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;position:sticky;top:0;background:var(--bg);z-index:5}
header div{flex:1}h1{margin:0;font-size:20px;letter-spacing:5px;color:var(--ac)}small{color:var(--mu)}
button,label.bl{background:#1f2b39;color:var(--tx);border:0;border-radius:10px;padding:10px 14px;font:inherit;display:inline-block;margin:2px}
button.p{background:var(--ac);color:#06241a;font-weight:700}button.on{outline:2px solid var(--ac)}
.c{background:var(--cd);border-radius:14px;padding:12px;margin:10px 12px}
article.c{display:flex;gap:10px;align-items:center}article .i{flex:1}article .a{display:flex;flex-direction:column}
h3,h4,h2{margin:4px 0}.sv{width:76px;flex:none}.fig{width:100%;height:auto}
.fig line,.fig polyline{stroke:var(--ac);stroke-width:3.5;stroke-linecap:round;fill:none}
.fig .hd{fill:var(--ac)}.fig .kb{fill:var(--wm)}
.bar{height:6px;background:#233142;border-radius:4px;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.ch{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 10px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.9);overflow:auto;z-index:20}
.mb{max-width:520px;margin:0 auto;padding:14px;min-height:100%;background:var(--bg)}
textarea,input{width:100%;background:#0f151d;color:var(--tx);border:1px solid #2a3a4c;border-radius:8px;padding:8px;font:inherit;margin:4px 0}
input[type=time]{width:auto}
.wh{display:flex;justify-content:space-between;align-items:center}
.cam{position:relative;aspect-ratio:4/3;max-height:34vh;width:100%;background:#000;border-radius:12px;overflow:hidden;margin:8px 0}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.fb{position:absolute;left:0;right:0;bottom:0;padding:8px;text-align:center;font-weight:800;background:rgba(0,0,0,.65);font-size:18px}
.fb small{display:block;font-weight:400;font-size:13px;color:inherit}
.fb.ok{color:#3ddc97}.fb.bad{color:var(--rd)}.fb.lost,.fb.cal,.fb.load{color:var(--wm)}
.wm{display:flex;gap:12px;align-items:center}.wm .sv{width:110px}
.big{font-size:64px;font-weight:800;line-height:1}.ph{font-weight:700;letter-spacing:1px;color:var(--ac)}
.ph.r{color:var(--wm);animation:pu .4s infinite alternate}@keyframes pu{to{transform:scale(1.1)}}
.bt{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body>
<header><div><h1>TENSI</h1><small>Lift Your Structure. Spring Your Fascia.</small></div>
<button onclick="setup()">⚙</button><button onclick="ps()">🛠</button></header>
<main id="app"></main><div id="md" hidden></div>
<script>
const K='tensi_pwa_v1',$=s=>document.querySelector(s);
const D={ob:0,f:'w',eq:'bw',kb:6,len:12,rec:10,core:1,lang:'id',voice:1,snd:1,cam:1,rt:'07:30',xp:0,done:0,slots:[],hist:[]};
let S;try{S={...D,...JSON.parse(localStorage.getItem(K)||'{}')}}catch(e){S={...D}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const R=['Open','Pull','Spring','Twist','Stack'];
// name|role|fascial line|focus(w,m,t)|kettlebell|core-safe|type(r=reps,h=hold)|kind
const RAW=`Golden Gate Opener|0|SFL|wmt|0|1|r|open
Wall-Angel Slide|0|SFL|wmt|0|1|r|press
Palm-Press Isometric|0|SFAL|w|0|1|h|squeeze
Clasp-Back Chest Lift|0|SFL|wmt|0|1|h|open
Overhead Reach-Back Stretch|0|SFL|mt|0|1|r|over
Cactus Arm Squeeze|0|SFAL|wm|0|1|r|press
Goblet Chest-Lift Squat|0|DFL|wm|1|1|r|squat
KB Halo|0|SFAL|wmt|1|1|r|over
KB Floor Pullover|0|SFL|w|1|0|r|floor
Rib-Expansion Breath Hold|0|DFL|wmt|0|1|h|open
Scapular Squeeze Row|1|DBAL|wmt|0|1|r|row
Standing Y-Raise|1|SBAL|wt|0|1|r|over
Reverse Snow-Angel|1|SBL|wmt|0|1|r|floor
Pull-Apart Mime|1|DBAL|wmt|0|1|r|apart
Chin-Tuck Retraction|1|SBL|t|0|1|r|nod
KB Supported Row|1|SBL|wm|1|1|r|row
KB High Pull|1|SBL|m|1|0|r|over
Superman Hold|1|SBL|wmt|0|1|h|floor
Good-Morning Hinge|1|SBL|wmt|0|1|r|squat
Face-Pull Mime|1|DBAL|wt|0|1|r|row
Heel-Spring Bounce|2|FL|wmt|0|1|r|bounce
Arm-Whip Recoil|2|FL|wmt|0|1|r|bounce
Shoulder-Pop Pulses|2|SFAL|wm|0|1|r|apart
Pogo Hops|2|FL|wmt|0|0|r|bounce
Skater Spring Shift|2|LL|wm|0|0|r|bounce
KB Swing|2|SBL|wm|1|0|r|swing
Clap Rebound Pulses|2|SFAL|wmt|0|1|r|squeeze
Hug Rebound Pulses|2|SFAL|wmt|0|1|r|open
Rebound Squat Pulses|2|FL|wmt|0|1|r|squat
KB Goblet Pulse Squat|2|DFL|wm|1|1|r|squat
Open-Book Rotation|3|SL|wmt|0|1|r|rot
Side-Bend Reach|3|LL|wmt|0|1|r|side
Thread-the-Needle Stand|3|SL|wmt|0|1|r|rot
Cross-Body Reach Pulse|3|SL|wm|0|1|r|rot
Bodyweight Windmill|3|LL|wm|0|1|r|side
KB Windmill|3|LL|m|1|0|r|side
KB Russian Twist|3|SL|m|1|0|r|rot
Seated Head-Turn|3|SL|t|0|1|r|tilt
Neck Side-Tilt Stretch|3|LL|t|0|1|h|tilt
Hip-Shift Lateral Stretch|3|LL|wmt|0|1|h|side
Wall Posture Stack|4|DFL|wmt|0|1|h|nod
Chin-Tuck Hold|4|DFL|t|0|1|h|nod
Seated Diaphragm Breath|4|DFL|wmt|0|1|h|open
Pelvic-Tilt Stack|4|DFL|wmt|0|1|r|squat
Deep-Neck Nod|4|DFL|t|0|1|r|nod
Pallof Press Mime|4|SL|wm|0|0|h|squeeze
Rib-Down Overhead Reach|4|DFL|wmt|0|1|h|over
KB Goblet Stack Hold|4|DFL|wm|1|1|h|squeeze
KB Suitcase Hold|4|LL|m|1|0|h|side
Shoulder-Pack Hold|4|SBAL|wmt|0|1|h|row`;
const V=RAW.trim().split(/\r?\n/).map((l,i)=>{const a=l.trim().split('|');return{id:i,n:a[0],r:+a[1],ln:a[2],f:a[3],kb:+a[4],cs:+a[5],t:a[6],k:a[7]}});
const DESK=['Chin-Tuck Hold','Neck Side-Tilt Stretch','Clasp-Back Chest Lift','Scapular Squeeze Row','Overhead Reach-Back Stretch'];
const KS={
open:['Stand tall, arms hugged across the chest.','Exhale: sweep arms wide, squeeze shoulder blades.','Inhale: hug back slowly, ribs down.'],
press:['Elbows bent 90° at shoulder height.','Exhale: press/slide arms up without arching.','Lower slowly, shoulder blades down.'],
squeeze:['Hands together at the sternum, elbows wide.','Press inward at 70% effort, exhale.','Keep shoulders away from ears.'],
over:['Stand tall, ribs stacked over hips.','Exhale: reach arms long overhead.','Lower with control, no rib flare.'],
row:['Elbows bent, arms in front of the chest.','Pull elbows back, squeeze blades.','Return slowly, do not shrug.'],
apart:['Arms forward, hands together.','Pull hands apart to a T, blades squeezing.','Return slowly, neck long.'],
nod:['Sit or stand tall, eyes level.','Glide the chin straight back (double chin).','Hold or release slowly, no head tilt.'],
tilt:['Tall spine, shoulders down.','Slowly tilt or turn the head to one side.','Return to centre, then the other side.'],
rot:['Feet hip-width, arms out at shoulder height.','Exhale: rotate the ribcage, hips stay still.','Return to centre, alternate sides.'],
side:['Stand tall, one arm overhead.','Reach up and over, ribs stay stacked.','Return slowly and switch sides.'],
bounce:['Soft knees, tall posture, ribs down.','Small springy pulses from feet and arms.','Land quietly, stay light and elastic.'],
squat:['Feet shoulder-width, chest proud.','Sit hips back and down, exhale on the way up.','Drive through heels, ribs over hips.'],
swing:['Hinge hips back, bell between knees.','Snap hips forward, bell floats to chest height.','Let it fall back, hinge, repeat.'],
floor:['Lie down, ribs soft, neck long.','Exhale: sweep or lift slowly through the range.','Return slowly, no low-back arch.']};
const CH={open:'level shrug chin',press:'level shrug chin sym',squeeze:'level shrug close',over:'level shrug chin sym',row:'level shrug sym',apart:'level shrug chin sym',nod:'level head',tilt:'shrug',rot:'shrug',side:'shrug',bounce:'level shrug',squat:'level shrug',swing:'level shrug',floor:''};
const MT={open:'ws',press:'wy',over:'wy',row:'ea',apart:'ws',rot:'rt',side:'lean',squat:'sq',swing:'wy'};
const MR={wy:.5,ws:.6,ea:.3,sq:.25,rt:.12,lean:.25};
const TP={open:4,press:4,squeeze:3,over:4,row:3,apart:3,nod:3,tilt:5,rot:4,side:4,bounce:1.5,squat:4,swing:2.5,floor:4};
const X={level:['Ratakan bahu kiri-kanan','Level your shoulders'],shrug:['Turunkan bahu, jauhi telinga','Drop shoulders from ears'],chin:['Tegakkan kepala, tarik dagu','Lift head, tuck chin'],head:['Jangan miringkan kepala','Keep head level'],sym:['Samakan tinggi kedua tangan','Match both hands'],close:['Rapatkan telapak tangan di dada','Press hands together at chest'],lost:['Masuk ke dalam frame kamera','Step into the camera frame'],cal:['Kalibrasi: duduk/berdiri tegak','Calibrating: sit/stand tall'],na:['Gerakan lantai – tidak dinilai','Floor move – not judged'],load:['Memuat AI pose…','Loading pose AI…'],off:['Kamera mati','Camera off']};
const tx=k=>X[k][S.lang=='id'?0:1];
// ---------- animated SVG ----------
const KD={open:{u:[25,95,25],f:[-110,-5,-110],d:4},press:{u:[92,172,92],f:[90,-4,90],d:4},squeeze:{u:[55,55,55],f:[-120,-100,-120],d:2},over:{u:[10,172,10],f:[0,-4,0],d:4},row:{u:[75,45,75],f:[-20,-120,-20],d:3},apart:{u:[88,96,88],f:[-100,-4,-100],d:3.5},nod:{u:[3,3,3],f:[0,0,0],hy:[0,4,0],d:3},tilt:{u:[3,3,3,3,3],f:[0,0,0,0,0],h:[0,-22,0,22,0],d:6},rot:{u:[92,92,92,92,92],f:[0,0,0,0,0],t:[0,-14,0,14,0],d:6},side:{u:[5,172,5],f:[0,-4,0],r:{u:[-5,-5,-5],f:[0,0,0]},t:[0,-16,0],d:4},bounce:{u:[28,48,28,48,28],f:[-90,-110,-90,-110,-90],y:[0,-6,0,-6,0],d:1.2},squat:{u:[60,60,60],f:[-100,-100,-100],y:[0,13,0],g:1,d:4},swing:{u:[10,140,10],f:[0,0,0],y:[0,6,0],d:2.4},floor:{u:[12,172,12],f:[0,0,0],lay:1,d:4}};
function svg(k,kb,hold){const d=KD[k];
const A=(t,v)=>`<animateTransform attributeName="transform" type="${t}" values="${v.join(';')}" keyTimes="${v.map((_,i)=>(i/(v.length-1)).toFixed(2)).join(';')}" calcMode="spline" keySplines="${v.slice(1).map(()=>'.45 0 .25 1').join(';')}" dur="${d.d}s" repeatCount="indefinite"/>`;
const arm=(x,u,f)=>`<g transform="translate(${x},38)"><g>${A('rotate',u)}<line y2="21"/><g transform="translate(0,21)"><g>${A('rotate',f)}<line y2="19"/><circle cy="19" r="2.6" class="hd"/>${kb&&x<50?'<circle cy="26" r="5.5" class="kb"/>':''}</g></g></g></g>`;
const ng=a=>a.map(v=>-v),r=d.r||{u:ng(d.u),f:ng(d.f)};
const hd=`<g>${d.hy?A('translate',d.hy.map(y=>'0 '+y)):''}<g>${d.h?A('rotate',d.h.map(a=>a+' 50 22')):''}<circle class="hd" cx="50" cy="22" r="9"/></g></g>`;
const body=`<g>${d.t?A('rotate',d.t.map(a=>a+' 50 72')):''}<line x1="50" y1="32" x2="50" y2="72"/>${hd}${arm(38,d.u,d.f)}${arm(62,r.u,r.f)}</g>`;
const sp='calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .25 1;.45 0 .25 1"';
const lg=d.g?`<polyline points="50,72 43,90 41,106"><animate attributeName="points" values="50,72 43,90 41,106;50,85 33,97 41,106;50,72 43,90 41,106" ${sp} dur="${d.d}s" repeatCount="indefinite"/></polyline><polyline points="50,72 57,90 59,106"><animate attributeName="points" values="50,72 57,90 59,106;50,85 67,97 59,106;50,72 57,90 59,106" ${sp} dur="${d.d}s" repeatCount="indefinite"/></polyline>`:'<polyline points="50,72 43,90 41,106"/><polyline points="50,72 57,90 59,106"/>';
const pl=hold?'<circle cx="50" cy="48" fill="none" stroke="#ffb86b" stroke-width="2"><animate attributeName="r" values="8;24;8" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/></circle>':'';
return `<svg class="fig" viewBox="0 0 100 110"><g${d.lay?' transform="translate(50 62) rotate(90) scale(.85) translate(-50 -62)"':''}>${lg}<g>${d.y?A('translate',d.y.map(y=>'0 '+y)):''}${body}</g>${pl}</g></svg>`}
// ---------- helpers ----------
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const lv=()=>S.xp>=12?3:S.xp>=4?2:1;
const tg=m=>m.t=='h'?[20,30,40][lv()-1]:[8,10,12][lv()-1];
const ok=m=>(S.eq=='kb'||!m.kb)&&(!S.core||m.cs);
function streak(){const s=new Set(S.hist.map(x=>x.d));let n=0,d=new Date();if(!s.has(dk(d)))d.setDate(d.getDate()-1);while(s.has(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function mo(h){const m=$('#md');m.innerHTML='<div class="mb">'+h+'</div>';m.hidden=false}
function mc(){const m=$('#md');m.hidden=true;m.innerHTML=''}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
// ---------- randomizer ----------
function roll(only){for(let i=0;i<5;i++){if(only!==undefined&&only!==i)continue;const c=S.slots[i];if(only===undefined&&c&&c.l&&V[c.id]&&ok(V[c.id]))continue;
let p=V.filter(m=>m.r===i&&ok(m));const q=p.filter(m=>m.f.includes(S.f));if(q.length)p=q;
if(S.eq=='kb'&&Math.random()<.5){const k=p.filter(m=>m.kb);if(k.length)p=k}
const o=p.filter(m=>!c||m.id!==c.id);if(o.length)p=o;S.slots[i]={id:p[Math.random()*p.length|0].id,l:0}}save();render()}
function lk(i){S.slots[i].l=S.slots[i].l?0:1;save();render()}
function pin(i){const m=V[i];if(!ok(m)){alert('Not available with your current setup (equipment / core-safe).');return}S.slots[m.r]={id:i,l:1};save();render()}
function init(){S.slots=S.slots.filter(c=>c&&V[c.id]);if(S.slots.length!=5){S.slots=[];roll()}else render()}
// ---------- main UI ----------
let VO=0;
function vt(d,i){const b=d.lastElementChild;if(d.open&&!b.innerHTML)b.innerHTML=`<div class="sv">${svg(V[i].k,V[i].kb,V[i].t=='h')}</div><button onclick="pin(${i})">📌 Pin to slot ${V[i].r+1}</button>`}
function render(){const L=lv(),pc=L==3?100:(S.xp-(L==2?4:0))/(L==1?4:8)*100;
const sl=S.slots.map((c,i)=>{const m=V[c.id];return `<article class="c"><div class="sv">${svg(m.k,m.kb,m.t=='h')}</div><div class="i"><small>${i+1} · ${R[m.r]} · ${m.ln}</small><h3>${m.n}</h3><small>${m.t=='h'?'Hold '+tg(m)+'s':tg(m)+' reps'}${m.kb?' · 🔔 '+S.kb+(S.kb==12?'kg+':'kg'):''}</small><details><summary>3-step guide</summary><ol>${KS[m.k].map(s=>'<li>'+s+'</li>').join('')}</ol></details></div><div class="a"><button onclick="lk(${i})">${c.l?'📌':'📍'}</button>${c.l?'':`<button onclick="roll(${i})">↻</button>`}</div></article>`}).join('');
const vault=`<details class="c" ${VO?'open':''} ontoggle="VO=this.open?1:0"><summary><b>Move Vault (50)</b></summary>${R.map((r,i)=>'<h4>'+r+'</h4>'+V.filter(m=>m.r==i).map(m=>`<details ontoggle="vt(this,${m.id})"><summary>${m.n} <small>${m.ln}${m.kb?' · 🔔':''}${m.cs?'':' · ⚠ core'}</small></summary><div></div></details>`).join('')).join('')}</details>`;
$('#app').innerHTML=`<section class="c"><b>Lv.${L}</b> · 🔥 ${streak()} day streak · ${S.done} sessions<div class="bar"><i style="width:${pc}%"></i></div><small>${S.f=='w'?"Women's Chest Lift":S.f=='m'?"Men's Upper Chest":'Tech-Neck & Posture'} · ${S.eq=='kb'?S.kb+'kg KB':'Bodyweight'} · ${S.len} min · recoil ${S.rec}s${S.core?' · Core-safe':''}</small></section><div class="c"><button class="p" onclick="go()">▶ Start ${S.len}-min session</button> <button onclick="roll()">🎲 Re-Roll unlocked</button> <button onclick="go(1)">🪑 5-min Desk Reset</button></div>${sl}${vault}`}
// ---------- setup modal ----------
const ch=(k,o)=>'<div class="ch">'+o.map(([v,t])=>`<button class="${S[k]==v?'on':''}" onclick="st('${k}','${v}')">${t}</button>`).join('')+'</div>';
const tgl=(k,t)=>`<button class="${S[k]?'on':''}" onclick="S.${k}=S.${k}?0:1;save();setup()">${t}: ${S[k]?'ON':'OFF'}</button>`;
function st(k,v){S[k]=isNaN(v)?v:+v;save();setup()}
function setup(){mo(`<h2>TENSI Setup</h2><small>Lift Your Structure. Spring Your Fascia.</small>
<h4>Structure focus</h4>${ch('f',[['w',"Women's Chest Lift"],['m',"Men's Upper Chest"],['t','Tech-Neck & Posture']])}
<h4>Equipment</h4>${ch('eq',[['bw','Bodyweight Only'],['kb','1 Kettlebell']])}${S.eq=='kb'?ch('kb',[[4,'4kg'],[6,'6kg'],[8,'8kg'],[12,'12kg+']]):''}
<h4>Session length</h4>${ch('len',[[5,'5 min'],[12,'12 min'],[20,'20 min']])}
<h4>Elastic Recoil</h4>${ch('rec',[[10,'10s'],[20,'20s']])}
<div class="ch">${tgl('core','Core/Diastasis Safe')}${tgl('cam','Camera')}${tgl('voice','Voice')}${tgl('snd','Ticks')}<button onclick="S.lang=S.lang=='id'?'en':'id';save();setup()">Coach: ${S.lang=='id'?'Bahasa':'English'}</button></div>
<details><summary>Reminder &amp; Backup</summary><p>Daily time <input type="time" value="${S.rt}" onchange="S.rt=this.value;save()"> <button onclick="ics()">Export .ics</button></p><p><button onclick="bk()">Backup JSON</button> <label class="bl">Restore JSON<input type="file" accept=".json" hidden onchange="rs(this)"></label></p></details>
<p><button class="p" onclick="dn()">Done</button></p>`)}
function dn(){const f=!S.ob;S.ob=1;save();mc();if(f||S.slots.some(c=>!ok(V[c.id])))roll();else render()}
function ics(){const t=(S.rt||'07:30').replace(':','')+'00',z=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
dl('tensi-reminder.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TENSI//EN','BEGIN:VEVENT','UID:tensi-daily@tensi-app.pages.dev','DTSTAMP:'+z,'DTSTART:'+dk().replace(/-/g,'')+'T'+t,'DURATION:PT'+S.len+'M','RRULE:FREQ=DAILY','SUMMARY:TENSI - Lift Your Structure. Spring Your Fascia.','URL:https://tensi-app.pages.dev','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:TENSI session','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n'),'text/calendar')}
function bk(){dl('tensi-backup-'+dk()+'.json',JSON.stringify(S,null,1),'application/json')}
function rs(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{S={...D,...JSON.parse(t)};save();init();setup()}catch(e){alert('Invalid backup file')}})}
// ---------- audio / voice / wake lock ----------
let AC,WL;
function bp(f,d,t){if(!S.snd||!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}}
function say(t){if(!S.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=S.lang=='id'?'id-ID':'en-US';speechSynthesis.speak(u)}catch(e){}}
async function wl(){try{WL=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&W&&W.run)wl()});
// ---------- workout ----------
let W=null,C={on:0,ld:0};
function go(desk){const sl=desk?DESK.map(n=>V.findIndex(m=>m.n==n)):S.slots.map(c=>c.id),len=desk?5:S.len,rd=len==5?1:len==12?2:3,per=len*60/(rd*5),ph=[];
for(let r=0;r<rd;r++)sl.forEach(id=>ph.push({k:'p',d:5,id},{k:'w',d:per-5-S.rec,id},{k:'r',d:S.rec,id}));
W={ph,pi:0,left:5,run:0,up:0,pz:0,auto:0,man:0,hold:0,g:0,tot:0,desk,len,form:'off',msg:'',B:null,bn:0,gn:0,seen:0,sy:0,mk:-1,dn:0};
RC.lo=RC.hi=null;RC.u=0;RC.n=0;
mo(`<div class="wh"><b id="wt"></b><button onclick="wx()">✕</button></div>
<div class="cam"><video id="vd" playsinline muted></video><canvas id="cv"></canvas><div id="fb" class="fb off"><small>${tx('off')}</small></div></div>
<small>🔒 On-device only. No video is recorded or stored.</small>
<div class="wm"><div class="sv" id="wsv"></div><div><h2 id="wn"></h2><div id="wph" class="ph"></div><div id="wl" class="big"></div><div id="wc"></div></div></div>
<ol id="wg"></ol><div class="bt"><button id="bs" class="p" onclick="ws()">▶ Start</button><button onclick="wk()">⏭ Skip</button><button onclick="wr()">+1 rep</button><button onclick="wcm()">📷 Camera</button></div>`);wui()}
function wui(){if(!W||!$('#wt'))return;const p=W.ph[W.pi],m=V[p.id],g=W.pi/3|0;
if(W.mk!==g){W.mk=g;$('#wsv').innerHTML=svg(m.k,m.kb,m.t=='h');$('#wn').textContent=m.n;$('#wg').innerHTML=KS[m.k].map(s=>'<li>'+s+'</li>').join('')}
$('#wt').textContent=(W.desk?'Desk Reset · ':'')+'Move '+(g%5+1)+'/5 · Round '+((g/5|0)+1)+'/'+(W.ph.length/15);
const e=$('#wph');e.className='ph '+p.k;e.textContent=p.k=='p'?'GET READY':p.k=='w'?'CONTROL':'⚡ ELASTIC RECOIL';
$('#wl').textContent=Math.max(0,Math.ceil(W.left));
$('#wc').textContent=m.t=='h'?'Hold '+Math.floor(W.hold)+'s / '+tg(m)+'s':'Reps '+(W.auto+W.man)+' / '+tg(m);
$('#bs').textContent=!W.run?'▶ Start':W.up?'▶ Resume':'⏸ Pause'}
function fbu(){const e=$('#fb');if(!e||!W)return;const f=W.form;e.className='fb '+f;e.innerHTML=f=='ok'?'✓ BENAR':f=='bad'?'✕ SALAH<small>'+W.msg+(W.pz?' · ⏸':'')+'</small>':f=='wait'?'…':'<small>'+tx(f)+'</small>'}
function nph(){const p=W.ph[W.pi],m=V[p.id],id=S.lang=='id';
if(p.k=='p'){W.auto=0;W.man=0;W.hold=0;W.dn=0;RC.lo=RC.hi=null;RC.u=0;RC.n=0;say((id?'Berikutnya: ':'Next: ')+m.n)}
else if(p.k=='w')say(id?'Mulai. Tegangan terkontrol.':'Go. Controlled tension.');
else{say(id?'Elastic recoil! Pantulkan!':'Elastic recoil! Spring!');bp(740,.15);setTimeout(()=>bp(988,.15),180)}wui()}
function ws(){if(!W)return;if(!W.run){W.run=1;W.t=performance.now();W.iv=setInterval(tk,200);AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();wl();nph();if(S.cam&&!C.on)cs()}else{W.up=W.up?0:1;W.t=performance.now()}wui()}
function wk(){if(!W)return;W.pi++;if(W.pi>=W.ph.length)return fin();W.left=W.ph[W.pi].d;nph()}
function wr(){if(W){W.man++;wui()}}
function wcm(){if(!W)return;if(C.on){cc();S.cam=0;W.form='off'}else{S.cam=1;cs()}save();fbu()}
function tk(){if(!W||!W.run)return;const n=performance.now(),dt=Math.min((n-W.t)/1e3,.5);W.t=n;const p=W.ph[W.pi],m=V[p.id],w=p.k!='p';
if(w&&C.on&&(W.form=='ok'||W.form=='bad')){W.tot++;if(W.form=='ok')W.g++}
const pz=!W.up&&w&&C.on&&(W.form=='bad'||W.form=='lost');
if(pz!==W.pz){W.pz=pz;fbu()}
if(W.up||pz||W.form=='cal'||W.form=='load'){wui();return}
const a=Math.ceil(W.left);W.left-=dt;const b=Math.ceil(W.left);
if(a!=b&&a<=3&&a>=1)bp(a==1?880:660,.1);
if(p.k=='r'&&Math.floor((p.d-W.left)*2)!=Math.floor((p.d-W.left-dt)*2))bp(520,.05,'square');
if(p.k=='w'){W.hold=p.d-W.left;if(!(C.on&&MT[m.k]))W.auto=Math.floor(W.hold/TP[m.k]);
if(m.t!='h'&&!W.dn&&W.auto+W.man>=tg(m)){W.dn=1;bp(988,.2)}}
if(W.left<=0){W.pi++;if(W.pi>=W.ph.length)return fin();W.left=W.ph[W.pi].d;nph()}
wui()}
function cc(){C.on=0;cancelAnimationFrame(C.r);if(C.s)C.s.getTracks().forEach(t=>t.stop());C.s=null}
function stop(){if(W)clearInterval(W.iv);cc();try{if(WL)WL.release()}catch(e){}try{speechSynthesis.cancel()}catch(e){}W=null}
function wx(){stop();mc();render()}
function fin(){const f=W.tot?Math.round(W.g/W.tot*100):null,len=W.len;
if(!W.desk){S.xp+=f!==null&&f>=80?1.5:1;S.done++}
S.hist.push({d:dk(),m:len,f});S.hist=S.hist.slice(-120);save();stop();
say(S.lang=='id'?'Selesai. Kerja bagus!':'Done. Great work!');
mo(`<h2>Session complete ✓</h2><p>${len} min · Lv.${lv()}${f!==null?' · Form '+f+'% BENAR':''}</p><button class="p" onclick="mc();render()">Close</button>`)}
// ---------- camera + MediaPipe Pose (on-device) ----------
const RC={lo:null,hi:null,u:0,n:0};
function rc(v,mr){if(RC.lo===null){RC.lo=RC.hi=v;return}
RC.lo=v<RC.lo?v:RC.lo+(v-RC.lo)*.01;RC.hi=v>RC.hi?v:RC.hi-(RC.hi-v)*.01;const r=RC.hi-RC.lo;if(r<mr)return;
if(!RC.u&&v>RC.lo+.7*r)RC.u=1;else if(RC.u&&v<RC.lo+.3*r){RC.u=0;RC.n++;W.auto=RC.n}}
const ang=(a,b,c)=>{const x=Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x);const d=Math.abs(x*180/Math.PI);return d>180?360-d:d};
function cx(lm){const v=(...a)=>a.every(i=>(lm[i].visibility??1)>.5),L=lm[11],R=lm[12],sw=Math.hypot(L.x-R.x,L.y-R.y)||1e-3,sy=(L.y+R.y)/2;
return{lm,v,L,R,sw,sy,mx:(L.x+R.x)/2,nz:lm[0],ey:(lm[7].y+lm[8].y)/2,wv:v(15,16),wy:(sy-(lm[15].y+lm[16].y)/2)/sw,wsp:Math.hypot(lm[15].x-lm[16].x,lm[15].y-lm[16].y)/sw,hv:v(23,24),hx:(lm[23].x+lm[24].x)/2}}
const CK={level:c=>Math.abs(c.L.y-c.R.y)/c.sw>.24&&'level',
shrug:c=>W.B&&c.v(7,8)&&(c.sy-c.ey)/c.sw<W.B.es*.7&&'shrug',
chin:c=>W.B&&c.v(0)&&(c.sy-c.nz.y)/c.sw<W.B.ns*.78&&'chin',
head:c=>c.v(7,8)&&Math.abs(c.lm[7].y-c.lm[8].y)/c.sw>.2&&'head',
sym:c=>c.wv&&Math.abs(c.lm[15].y-c.lm[16].y)/c.sw>.6&&'sym',
close:c=>c.wv&&c.wsp>1.1&&'close'};
const MET={wy:c=>c.wv?c.wy:null,ws:c=>c.wv?c.wsp:null,ea:c=>c.v(13,14,15,16)?(ang(c.lm[11],c.lm[13],c.lm[15])+ang(c.lm[12],c.lm[14],c.lm[16]))/360:null,sq:c=>c.sy/c.sw,rt:c=>W.B?c.sw/W.B.sw:null,lean:c=>c.hv?(c.mx-c.hx)/c.sw:(W.B?(c.mx-W.B.mx)/c.sw:null)};
const CN=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[0,11],[0,12]];
function cal(c){if(!c.v(0,7,8))return;const B=W.cb||(W.cb={n:0,sw:0,mx:0,es:0,ns:0});B.n++;B.sw+=c.sw;B.mx+=c.mx;B.es+=(c.sy-c.ey)/c.sw;B.ns+=(c.sy-c.nz.y)/c.sw;
if(B.n>=15){W.B={sw:B.sw/15,mx:B.mx/15,es:B.es/15,ns:B.ns/15};W.cb=null;W.form='wait';say(S.lang=='id'?'Kalibrasi selesai':'Calibrated');fbu()}}
async function cs(){if(C.ld||!W)return;C.ld=1;W.form='load';fbu();
try{if(!C.m){const M=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
const F=await M.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1});
try{C.m=await M.PoseLandmarker.createFromOptions(F,o('GPU'))}catch(e){C.m=await M.PoseLandmarker.createFromOptions(F,o('CPU'))}}
const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
if(!W){s.getTracks().forEach(t=>t.stop());C.ld=0;return}
C.s=s;const v=$('#vd');v.srcObject=s;await v.play();C.on=1;W.form='cal';W.B=null;W.cb=null;W.ls=W.seen=performance.now();fbu();pll()}
catch(e){C.on=0;if(W){W.form='off';fbu()}}C.ld=0}
function pll(){if(!C.on)return;const v=$('#vd'),n=performance.now();
if(v&&v.readyState>=2&&n-(C.t||0)>66){C.t=n;try{pf(C.m.detectForVideo(v,n))}catch(e){}}C.r=requestAnimationFrame(pll)}
function pf(r){if(!W||!C.on)return;const v=$('#vd'),cv=$('#cv');if(!v||!cv)return;const n=performance.now();
if(W.form=='cal'&&n-W.ls>9000){W.form='wait';W.cb=null;fbu()}
if(cv.width!=v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight}
const x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);const lm=r.landmarks&&r.landmarks[0];
if(!lm||!(lm[11].visibility>.5&&lm[12].visibility>.5)){if(n-W.seen>2500&&W.form!='cal'&&W.form!='lost'){W.form='lost';fbu()}return}
W.seen=n;const c=cx(lm);
x.strokeStyle=W.form=='bad'?'#ff5d6c':'#3ddc97';x.lineWidth=4;x.beginPath();
CN.forEach(([a,b])=>{if(lm[a].visibility>.4&&lm[b].visibility>.4){x.moveTo(lm[a].x*cv.width,lm[a].y*cv.height);x.lineTo(lm[b].x*cv.width,lm[b].y*cv.height)}});x.stroke();
if(W.form=='cal')return cal(c);
const p=W.ph[W.pi],m=V[p.id];
if(m.k=='floor'){if(W.form!='na'){W.form='na';fbu()}return}
let bad=0;for(const k of CH[m.k].split(' ')){if(CK[k]&&(bad=CK[k](c)))break}
if(bad){W.gn=0;if(++W.bn>=8){const t=tx(bad);if(W.form!='bad'){W.form='bad';W.msg=t;if(n-W.sy>5000){W.sy=n;say(t)}fbu()}else if(W.msg!=t){W.msg=t;fbu()}}}
else{W.bn=0;if(++W.gn>=4&&W.form!='ok'){W.form='ok';fbu()}}
const mt=MT[m.k];if(mt&&p.k=='w'&&W.form!='bad'){const q=MET[mt](c);if(q!=null)rc(q,MR[mt])}}
// ---------- JSON Patch Studio (manual, no GitHub API) ----------
function ps(){mo(`<h2>JSON Patch Studio</h2><button onclick="pl()">Load live TENSI HTML</button>
<textarea id="pc" rows="6" placeholder="…or paste raw code here"></textarea>
<small>Target file path</small><input id="pp" value="index.html"><small>Commit message</small><input id="pm" value="Update TENSI">
<button class="p" onclick="pb()">Build tensi-patch.json</button><textarea id="po" rows="6" readonly></textarea>
<button onclick="pcp()">Copy JSON</button><button onclick="pdl()">Download tensi-patch.json</button><p id="ph"><small></small></p><button onclick="mc()">Close</button>`)}
async function pl(){try{const r=await fetch('index.html',{cache:'no-store'});$('#pc').value=await r.text();$('#ph').textContent='Loaded '+$('#pc').value.length+' characters'}catch(e){$('#ph').textContent='Load failed – paste the code instead'}}
async function pb(){const c=$('#pc').value;if(!c){$('#ph').textContent='Nothing to patch yet';return}let sha='';
try{sha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(c)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){}
$('#po').value=JSON.stringify({schema:'tensi-patch/1',app:'TENSI',created:new Date().toISOString(),message:$('#pm').value,target:{path:$('#pp').value.trim()||'index.html',bytes:new Blob([c]).size,sha256:sha},action:'replace-file',content:c},null,1);$('#ph').textContent='Built ✓ ('+$('#po').value.length+' characters)'}
function pcp(){const o=$('#po');if(!o.value){$('#ph').textContent='Build the JSON first';return}
(navigator.clipboard?navigator.clipboard.writeText(o.value):Promise.reject()).then(()=>$('#ph').textContent='Copied ✓').catch(()=>{o.select();document.execCommand('copy');$('#ph').textContent='Copied ✓'})}
function pdl(){const o=$('#po');if(!o.value){$('#ph').textContent='Build the JSON first';return}dl('tensi-patch.json',o.value,'application/json')}

init();if(!S.ob)setup();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
