<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TENSI Apply Patch</title></head>
<body style="font:15px system-ui;background:#0b0f14;color:#e8eef5;padding:14px;max-width:560px;margin:auto">
<h3>TENSI – Apply Patch</h3>
<p>1. Paste isi tensi-patch.json:</p>
<textarea id="p" rows="9" style="width:100%"></textarea>
<p><button onclick="ap()" style="padding:12px 16px;font-size:16px">2. Apply &amp; Download index.html</button></p>
<pre id="o" style="white-space:pre-wrap"></pre>
<script>
async function ap(){const o=document.getElementById('o');
try{const j=JSON.parse(document.getElementById('p').value);
let t=await (await fetch('index.html',{cache:'no-store'})).text(),n=0;
for(const e of j.edits){const i=t.indexOf(e.find);
if(i<0||t.indexOf(e.find,i+1)>=0)throw Error('Edit #'+(n+1)+' tidak cocok / tidak unik');
t=t.slice(0,i)+e.replace+t.slice(i+e.find.length);n++}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='index.html';a.click();
o.textContent='OK: '+n+' edit diterapkan. index.html terunduh. Timpa file lama di repo, lalu commit.'}
catch(e){o.textContent='GAGAL: '+e.message}}
</script></body></html>
